openapi: 3.1.0
info:
  title: Microservice OCR - License Plate Reader
  version: 1.0.0
  description: |
    Microservice that detects a vehicle's license plate in an image (YOLOv9)
    and extracts its alphanumeric text (PaddleOCR).

    Business errors follow the
    [RFC 9457 Problem Details](https://www.rfc-editor.org/rfc/rfc9457) standard
    (`application/problem+json`). Request validation errors
    (missing field) are generated by FastAPI in its own format.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /
    description: Current server

tags:
  - name: Health
    description: Service status
  - name: License Plate
    description: License plate reading

paths:
  /:
    get:
      tags: [Health]
      summary: Redirects to /health
      operationId: root
      security: []
      responses:
        "307":
          description: Temporary redirect to `/health`.
          headers:
            Location:
              schema:
                type: string
                example: /health

  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Checks that the service is up. Requires no authentication.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /read-license-plate:
    post:
      tags: [License Plate]
      summary: Read the license plate from an image
      description: |
        Receives **a single** vehicle image, detects the license plate region
        (detection confidence threshold: `0.83`) and returns the text read.
        Words unrelated to the plate (e.g. `REPUBLICA ARGENTINA`, `MERCOSUR`)
        are filtered out automatically.
      operationId: readLicensePlate
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Vehicle image (JPG, PNG, etc.). Only one file per request is accepted.
            encoding:
              image:
                contentType: image/*
      responses:
        "200":
          description: License plate read successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicensePlateResponse"
              example:
                license_plate: AB123CD
        "400":
          description: The image is not valid or several files were sent.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                invalidImage:
                  summary: File that cannot be decoded as an image
                  value:
                    type: about:blank
                    title: Invalid Image
                    status: 400
                    detail: The uploaded file could not be decoded as a valid image.
                    instance: http://localhost:8000/read-license-plate
                multipleImages:
                  summary: More than one file in the form
                  value:
                    type: about:blank
                    title: Multiple Images
                    status: 400
                    detail: Only one image is allowed per request.
                    instance: http://localhost:8000/read-license-plate
        "401":
          description: The `x-api-key` header is missing or the API key is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: The provided API key is invalid or missing.
                instance: http://localhost:8000/read-license-plate
        "422":
          description: |
            The image could not be processed, or the request is incomplete.

            - Processing errors → `application/problem+json`.
            - Missing `image` field → `application/json`
              in the FastAPI validation format.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                noPlateDetected:
                  summary: No license plate was detected
                  value:
                    type: about:blank
                    title: License Plate Detection Failed
                    status: 422
                    detail: No license plate was detected in the image.
                    instance: http://localhost:8000/read-license-plate
                lowConfidence:
                  summary: Detection confidence below the threshold
                  value:
                    type: about:blank
                    title: Low Detection Confidence
                    status: 422
                    detail: "Confidence threshold not met: 0.61"
                    instance: http://localhost:8000/read-license-plate
                ocrImageIsNone:
                  summary: Null license plate crop
                  value:
                    type: about:blank
                    title: OCR Processing Failed
                    status: 422
                    detail: The provided image for OCR processing is null.
                    instance: http://localhost:8000/read-license-plate
                textExtractionFailed:
                  summary: OCR could not read the text
                  value:
                    type: about:blank
                    title: Text Extraction Failed
                    status: 422
                    detail: Could not extract license plate text from the image.
                    instance: http://localhost:8000/read-license-plate
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
              example:
                detail:
                  - type: missing
                    loc: [body, image]
                    msg: Field required
                    input: null

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key configured in the `API_KEY` environment variable.

  schemas:
    LicensePlateResponse:
      type: object
      required: [license_plate]
      properties:
        license_plate:
          type: string
          description: Text of the detected license plate.
          example: AB123CD

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: [string, "null"]
          description: URL of the request that caused the error.

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
        input: {}
